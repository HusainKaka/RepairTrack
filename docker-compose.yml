services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: repairtrack
      POSTGRES_USER: repairtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or root .env}
    ports:
      - "5432:5432"
    volumes:
      - repairtrack_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairtrack -d repairtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repairtrack_postgres:

